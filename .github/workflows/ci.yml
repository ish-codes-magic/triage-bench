name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs can read the repo and nothing else unless they opt in.
permissions:
  contents: read

# A new push to a PR cancels that PR's in-flight run; pushes to main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-env
      # Same hooks as a local commit (ruff, ruff format, pyright, file hygiene),
      # so "passes locally" and "passes in CI" mean the same thing.
      - name: pre-commit (all files)
        run: uv run pre-commit run --all-files --show-diff-on-failure

  leakage:
    # Its own job, so "no post-creation information reaches the agent" is a separately
    # visible (and requirable) status check rather than one test among hundreds.
    name: Leakage guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-env
      - name: pytest -m leakage
        run: uv run pytest -q -m leakage

  eval-smoke:
    # Evals as tests: run the baselines and the agent through the real `triagelab eval` CLI
    # on a synthetic dataset, and post the results to the job summary. The agent's model
    # calls replay recorded responses (tests/cassettes/): no API key, no spend, and any
    # unrecorded request fails the job. repo-intel runs as a real stdio subprocess.
    name: Eval smoke (fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-env
      - name: Build the synthetic smoke dataset
        run: uv run python -m tests.smoke_dataset "$RUNNER_TEMP/smoke"
      - name: Evaluate baselines
        run: |
          uv run triagelab eval -c "$RUNNER_TEMP/smoke/majority.yaml" --split dev
          uv run triagelab eval -c "$RUNNER_TEMP/smoke/classifier.yaml" --split dev
      - name: Evaluate the agent (replayed from cassettes)
        run: uv run triagelab eval -c "$RUNNER_TEMP/smoke/agent.yaml" --split dev --limit 10
      - name: Results table to job summary
        run: |
          echo "### Smoke eval (synthetic fixtures, dev split)" >> "$GITHUB_STEP_SUMMARY"
          uv run triagelab results --split dev -c "$RUNNER_TEMP/smoke/majority.yaml" \
            --out-dir "$RUNNER_TEMP/smoke/results" >> "$GITHUB_STEP_SUMMARY"
      - name: Agent trace stats to job summary
        run: |
          for run in "$RUNNER_TEMP"/smoke/runs/*-smoke-agent-*/; do
            uv run triagelab runs stats "$run" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Upload the agent's traces
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-smoke-traces
          path: |
            ${{ runner.temp }}/smoke/runs/*-smoke-agent-*/traces.jsonl
            ${{ runner.temp }}/smoke/runs/*-smoke-agent-*/predictions.jsonl
            ${{ runner.temp }}/smoke/runs/*-smoke-agent-*/mcp_server.log
          retention-days: 7

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is a real target: the project is developed on it.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-env
      - name: pytest
        shell: bash
        # GitHub runs bash with -eo pipefail, so a pytest failure still fails the step.
        run: |
          uv run pytest -q 2>&1 | tee pytest.log
          {
            echo "### Tests (${{ matrix.os }})"
            echo '```'
            tail -n 1 pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  reproduce:
    # The README's "reproduce in 3 commands", run for real on a machine that has nothing:
    # clone, install, `triagelab reproduce`. It downloads the public test packs, checks
    # their pinned SHA-256, re-scores the committed predictions against the committed
    # adjudicated labels, and fails if a headline table differs by a byte. No API key.
    name: Reproduce headline tables
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-env
      - name: triagelab reproduce
        run: |
          uv run triagelab reproduce | tee reproduce.log
          {
            echo "### Headline tables, rebuilt on a fresh runner"
            echo
            cat reproduce.log
          } >> "$GITHUB_STEP_SUMMARY"
