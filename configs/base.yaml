# Baseline configuration. Experiment files in configs/experiments/ declare
# `extends: ../base.yaml` and override only what they change.
name: base

budget:
  usd_total: 150.0   # AGENTS.md §0: hard cap across all runs
  usd_per_run: 5.0   # AGENTS.md §0: hard cap within one run

llm:
  # The agent model (ADR-0010): Qwen3.5-9B via OpenRouter, pinned to one provider and
  # precision so "the model" can't silently change between calls.
  # Any model+route used must have an entry in configs/prices.yaml, or calls are refused.
  model: openrouter/qwen/qwen3.5-9b
  route: {provider: deepinfra, quantization: bf16}
  temperature: null   # null = provider default; many current models reject other values
  seed: null
  max_tokens: 1024
  timeout_s: 60

retry:
  max_attempts: 4
  base_delay_s: 1.0
  max_delay_s: 30.0

cache:
  enabled: true
  dir: .cache/llm

paths:
  runs_dir: runs
  prices_file: configs/prices.yaml
  ledger_file: runs/spend_ledger.jsonl   # all-time spend; the $150 cap reads this
