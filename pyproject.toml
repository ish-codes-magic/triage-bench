[project]
name = "triagelab"
version = "0.1.0"
description = "Eval-driven GitHub issue triage: a typed decision layer, an LLM agent with MCP tools and Agent Skills, and every design choice measured."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.8.1",
    "httpx>=0.28.1",
    "litellm>=1.103.0",
    "markdown-it-py>=4.0.0",
    "matplotlib>=3.11.2",
    "mcp>=2.2,<3",
    "openinference-semantic-conventions==0.1.39",
    "opentelemetry-exporter-otlp-proto-http==1.45.0",
    "opentelemetry-sdk==1.45.0",
    "pillow>=12.3.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "typer>=0.27.2",
    "tzdata>=2026.4 ; sys_platform == 'win32'",
]

[project.scripts]
triagelab = "triagelab.cli:app"
# The MCP server on its own, for MCP clients: `uvx --from triagelab repo-intel --profile ...`
repo-intel = "triagelab.mcp_server.app:main"

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.25",
    "pre-commit>=4.6.2",
    "pyarrow-stubs>=20.0.0.20260819",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
labeling = [
    "streamlit==1.64.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "C4",      # comprehensions
    "N",       # naming
    "PTH",     # pathlib over os.path
    "PT",      # pytest style
    "RUF",     # ruff-specific
]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # Noise from litellm's own type definitions at import; not actionable here.
    "ignore:Item '.*' on TypedDict class '.*' is using the `ReadOnly` qualifier:UserWarning",
]
markers = [
    "your_turn: a YOUR TURN exercise; xfails until the stub is implemented (run with -m your_turn --runxfail to see it fail)",
    "leakage: guards that nothing from after an issue's creation reaches the agent (own CI check)",
]

[tool.uv]
# The labeling app (M5) is a separate group so it can be skipped (`--no-group labeling`),
# but it installs by default so CI tests it.
default-groups = ["dev", "labeling"]
