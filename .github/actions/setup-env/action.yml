name: Set up environment
description: Install a pinned uv, the Python from .python-version, and the locked dependencies.

runs:
  using: composite
  steps:
    # Caching is left on setup-uv's "auto" default, which disables it for tag pushes,
    # releases and pull_request_target, the events where a poisoned cache could leak
    # into a published artifact.
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: "0.11.18" # keep in step with the local uv that wrote uv.lock
        cache-dependency-glob: uv.lock

    # --locked fails if uv.lock is stale relative to pyproject.toml, instead of
    # silently re-resolving and testing different versions than we pinned.
    - name: Install locked dependencies
      shell: bash
      run: uv sync --locked
