# Ground-truth rules for astral-sh/uv (transfer repo, E8/H4). Written from the repository's
# label list and its directory layout at the freeze commit only; no uv issue from the
# evaluation window was read to write it. See docs/DECISIONS.md (ADR-0045).
repo: astral-sh/uv

# The same windows as the primary repo, so the two evaluations cover the same months.
# uv's dev split exists but is never evaluated or tuned on: transfer means "swap the
# skill and the profile, change nothing else".
windows:
  history_start: 2025-05-19
  index_start: 2024-02-01     # uv's public history starts in February 2024
  eval_start: 2026-05-19
  test_start: 2026-07-19
  eval_end: 2026-08-18

splits:
  dev_size: 100
  test_size: 50
  dev_min_positives: {duplicate: 12, needs_info: 12, component: 30}
  test_min_positives: {duplicate: 6, needs_info: 6, component: 15}
  seed: 20261001

# T1. The kind labels are effectively single-label; `area:*` is the multi-label family
# (it includes the platform labels area:linux / area:macos / area:windows).
taxonomy:
  type: [bug, enhancement, question, documentation]
  area: [performance, compatibility, internal, security]
  prefixes: ["area:"]

# T4. "Needs more information for reproduction".
needs_info_labels: [needs-mre]

# T3. uv PRs link issues with GitHub's closing keywords, which the collector reads
# natively; no title convention is needed, so the pattern never matches.
main_branch: main
linked_pr_title_pattern: '(?!)'

# Directory -> component, by functional group of crates. First matching prefix wins, so
# the integration tests under crates/uv/tests/ precede the crates/uv/ binary crate.
components:
  - {name: tests, prefixes: [crates/uv/tests/, crates/uv-test/, test/], role: supporting}
  - {name: docs, prefixes: [docs/, README.md, mkdocs.yml], role: supporting}
  - {name: resolver, prefixes: [crates/uv-resolver/, crates/uv-pep440/, crates/uv-pep508/, crates/uv-platform-tags/, crates/uv-requirements/, crates/uv-requirements-txt/, crates/uv-pypi-types/, crates/uv-normalize/, crates/uv-torch/]}
  - {name: installer, prefixes: [crates/uv-installer/, crates/uv-install-wheel/, crates/uv-extract/, crates/uv-distribution/, crates/uv-distribution-types/, crates/uv-distribution-filename/, crates/uv-virtualenv/, crates/uv-trampoline/, crates/uv-trampoline-builder/]}
  - {name: python, prefixes: [crates/uv-python/, crates/uv-bin-install/, crates/uv-platform/]}
  - {name: network, prefixes: [crates/uv-client/, crates/uv-auth/, crates/uv-keyring/, crates/uv-netrc/, crates/uv-publish/, crates/uv-git/, crates/uv-git-types/, crates/uv-redacted/]}
  - {name: cache, prefixes: [crates/uv-cache/, crates/uv-cache-info/, crates/uv-cache-key/]}
  - {name: build, prefixes: [crates/uv-build-backend/, crates/uv-build-frontend/, crates/uv-build/, crates/uv-dispatch/]}
  - {name: projects, prefixes: [crates/uv-workspace/, crates/uv-scripts/, crates/uv-tool/, crates/uv-state/]}
  - {name: cli, prefixes: [crates/uv/, crates/uv-cli/, crates/uv-settings/, crates/uv-configuration/, crates/uv-options-metadata/, crates/uv-console/, crates/uv-warnings/, crates/uv-logging/, crates/uv-shell/]}
  - {name: infra, prefixes: [.github/, scripts/, Dockerfile, dist-workspace.toml]}

# Every PR touches these; counting them would add noise to every vote.
ignore_paths: [CHANGELOG.md, changelogs/, Cargo.lock, uv.lock, uv.schema.json]
