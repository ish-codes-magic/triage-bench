name: uv-agent
budget:
  usd_total: 150.0
  usd_per_run: 5.0
llm:
  model: openrouter/qwen/qwen3.5-9b
  route:
    provider: deepinfra
    quantization: bf16
  reasoning: default
  temperature: 0.0
  seed: null
  max_tokens: 4000
  timeout_s: 180.0
  named_tool_choice: true
retry:
  max_attempts: 8
  base_delay_s: 1.0
  max_delay_s: 60.0
cache:
  enabled: true
  dir: .cache/llm
  replay_only: false
paths:
  runs_dir: runs
  prices_file: configs/prices.yaml
  ledger_file: runs/spend_ledger.jsonl
dataset:
  profile: configs/repos/astral-sh__uv.yaml
  data_dir: data
  reports_dir: reports
eval:
  concurrency: 8
  bootstrap_resamples: 1000
  seed: 0
  subset: null
system:
  kind: agent
  max_body_chars: 12000
  min_label_count: 10
  agent:
    skills:
    - triage-uv
    skills_dir: skills
    skill_activation: model
    tools: null
    budget:
      max_steps: 12
      max_tool_calls: 15
      max_tokens: 200000
      max_cost_usd: 0.03
    max_tool_result_chars: 6000
    context_limit_tokens: 24000
    max_validation_retries: 2
    repeat_guard: true
    stuff_similar_k: 0
    architecture: single
    worker_budget:
      max_steps: 6
      max_tool_calls: 4
      max_tokens: 80000
      max_cost_usd: 0.01
    mcp:
      transport: stdio
      dense: true
  decisions: null
  routed: null
  family_label_min_confidence: 0.95
tracing:
  otlp_endpoint: null
  project: triagelab
