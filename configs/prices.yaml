# Model prices in USD per 1M tokens, keyed by the LiteLLM model string used in configs.
#
# Why we keep our own table instead of trusting LiteLLM's cost map: this file is reviewed,
# versioned with the code, and cites where each number came from, so a run's cost can be
# reproduced later. LiteLLM's reported cost is still logged next to ours as a cross-check.
#
# A model with no entry here cannot be called: the budget guard refuses to spend money
# it cannot price.
#
# Known simplifications (see docs/DECISIONS.md, ADR-0005):
#   - Anthropic cache *writes* (1.25x input) are not modelled; we do not enable prompt caching yet.
#   - Long-context surcharges (OpenAI >272K input, Gemini Pro >200K) are not modelled;
#     triage prompts stay far below those thresholds.

models:
  # --- OpenRouter (the key we actually use) ---
  # Keyed "<model>@<provider>[/<quantization>]": the same model costs different amounts on
  # different providers, and each route is pinned (ADR-0010). Source for every entry:
  # https://openrouter.ai/api/v1/models/<model>/endpoints
  openrouter/qwen/qwen3.5-9b@deepinfra/bf16:
    input_per_mtok: 0.10
    output_per_mtok: 0.15
    source: https://openrouter.ai/api/v1/models/qwen/qwen3.5-9b/endpoints
    verified_on: 2026-09-29
    notes: Agent route. Tools + JSON schema at full precision; no logprobs on this provider.
  openrouter/qwen/qwen3.5-9b@parasail/bf16:
    input_per_mtok: 0.10
    output_per_mtok: 0.25
    source: https://openrouter.ai/api/v1/models/qwen/qwen3.5-9b/endpoints
    verified_on: 2026-09-29
    notes: Decision-backend route. Logprobs + JSON schema at full precision; no tools.
  openrouter/qwen/qwen3.5-9b@venice/fp8:
    input_per_mtok: 0.10
    output_per_mtok: 0.15
    source: https://openrouter.ai/api/v1/models/qwen/qwen3.5-9b/endpoints
    verified_on: 2026-10-01
    notes: E6 LLM decision backends (logprobs). Parasail's shared pool was saturated (ADR-0042).
  openrouter/qwen/qwen3.5-27b@alibaba:
    input_per_mtok: 0.195
    output_per_mtok: 1.56
    source: https://openrouter.ai/api/v1/models/qwen/qwen3.5-27b/endpoints
    verified_on: 2026-09-29
    notes: E5 size comparison (9B vs 27B). Official provider; precision not disclosed.
  openrouter/qwen/qwen3.5-27b@novita/bf16:
    input_per_mtok: 0.30
    output_per_mtok: 2.40
    source: https://openrouter.ai/api/v1/models/qwen/qwen3.5-27b/endpoints
    verified_on: 2026-09-30
    notes: E5 route after ADR-0039 (Alibaba rejects a named tool_choice). bf16, like the 9B arm.
  openrouter/openai/gpt-6-luna@openai:
    input_per_mtok: 0.10
    output_per_mtok: 0.50
    cached_input_per_mtok: 0.01
    source: https://openrouter.ai/api/v1/models/openai/gpt-6-luna/endpoints
    verified_on: 2026-09-29
    notes: Judge route. Prompts >272K tokens bill at 0.20/0.75 (not modelled).

